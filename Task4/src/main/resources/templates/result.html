<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Result')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container" style="max-width: 720px;" th:data-result-id="${resultId}" id="pageRoot">
    <div id="alertBox"></div>
    <div id="loadingState" class="text-center py-5 text-secondary">Loading result…</div>

    <div id="resultArea" class="d-none">
        <div class="text-center mb-4">
            <p class="section-eyebrow mb-1" id="quizTitle"></p>
            <h1 class="mb-2">Quiz complete</h1>
        </div>

        <div class="p-4 rounded text-center mb-4" id="passBanner">
            <div class="stat-figure" id="percentageFigure"></div>
            <div id="passLabel" class="fw-semibold"></div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card-paper p-3 text-center h-100">
                    <div class="stat-figure" id="scoreFigure" style="font-size:1.6rem;"></div>
                    <div class="text-secondary small">Score</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card-paper p-3 text-center h-100">
                    <div class="stat-figure text-success" id="correctFigure" style="font-size:1.6rem;"></div>
                    <div class="text-secondary small">Correct</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card-paper p-3 text-center h-100">
                    <div class="stat-figure" style="font-size:1.6rem; color: var(--danger);" id="incorrectFigure"></div>
                    <div class="text-secondary small">Incorrect</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card-paper p-3 text-center h-100">
                    <div class="stat-figure" id="timeFigure" style="font-size:1.6rem;"></div>
                    <div class="text-secondary small">Time taken</div>
                </div>
            </div>
        </div>

        <div class="card-paper p-4 mb-4">
            <div class="d-flex justify-content-between py-2 hairline">
                <span class="text-secondary">Total questions</span>
                <span class="text-mono fw-semibold" id="totalQ"></span>
            </div>
            <div class="d-flex justify-content-between py-2 hairline">
                <span class="text-secondary">Attempted</span>
                <span class="text-mono fw-semibold" id="attemptedQ"></span>
            </div>
            <div class="d-flex justify-content-between py-2 hairline">
                <span class="text-secondary">Total marks available</span>
                <span class="text-mono fw-semibold" id="totalMarks"></span>
            </div>
            <div class="d-flex justify-content-between py-2">
                <span class="text-secondary">Submitted</span>
                <span class="text-mono fw-semibold" id="submittedAt"></span>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a href="/dashboard" class="btn btn-outline-ink">More quizzes</a>
            <a href="/leaderboard" class="btn btn-amber">View leaderboard</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
(async function () {
    const resultId = document.getElementById('pageRoot').dataset.resultId;
    try {
        const r = await Api.get(`/api/results/${resultId}`);
        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('resultArea').classList.remove('d-none');

        document.getElementById('quizTitle').textContent = r.quizTitle;
        document.getElementById('percentageFigure').textContent = `${r.percentage}%`;

        const banner = document.getElementById('passBanner');
        const label = document.getElementById('passLabel');
        if (r.passed) {
            banner.classList.add('pass-banner');
            label.textContent = '✓ Passed';
        } else {
            banner.classList.add('fail-banner');
            label.textContent = '✗ Not passed';
        }

        document.getElementById('scoreFigure').textContent = `${r.score}/${r.totalMarks}`;
        document.getElementById('correctFigure').textContent = r.correctAnswers;
        document.getElementById('incorrectFigure').textContent = r.incorrectAnswers;
        document.getElementById('timeFigure').textContent = formatSeconds(r.timeTakenInSeconds);
        document.getElementById('totalQ').textContent = r.totalQuestions;
        document.getElementById('attemptedQ').textContent = r.attemptedQuestions;
        document.getElementById('totalMarks').textContent = r.totalMarks;
        document.getElementById('submittedAt').textContent = formatDate(r.submittedAt);
    } catch (err) {
        document.getElementById('loadingState').classList.add('d-none');
        showAlert('alertBox', err.message || 'Could not load this result');
    }
})();
</script>
</body>
</html>
