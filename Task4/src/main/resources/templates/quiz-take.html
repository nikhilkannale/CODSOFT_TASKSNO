<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Take Quiz')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container" style="max-width: 760px;" th:data-quiz-id="${quizId}" id="pageRoot">
    <div id="alertBox"></div>

    <div id="loadingState" class="text-center py-5 text-secondary">Loading quiz…</div>

    <div id="quizArea" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div>
                <p class="card-eyebrow mb-1" id="quizTitle"></p>
                <span class="question-number-badge" id="progressBadge">Question 1 of 1</span>
            </div>
            <span class="stopwatch" id="stopwatch">
                <span class="dot"></span>
                <span class="timer-display" id="timerDisplay">00:00</span>
            </span>
        </div>

        <div class="progress mb-4" style="height: 6px;">
            <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%; background-color: var(--ink);"></div>
        </div>

        <div class="card-paper p-4 p-md-5 mb-4">
            <h4 class="mb-4" id="questionText"></h4>
            <div class="d-flex flex-column gap-2" id="optionsArea"></div>
        </div>

        <div class="d-flex justify-content-between">
            <button class="btn btn-outline-ink" id="prevBtn">&larr; Previous</button>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-ink d-none" id="nextBtn">Next &rarr;</button>
                <button class="btn btn-amber d-none" id="submitBtn">Submit quiz</button>
            </div>
        </div>

        <p class="text-secondary small text-center mt-4">
            Answers save automatically. Submitting is final — you can't change answers afterward.
        </p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
const quizId = Number(document.getElementById('pageRoot').dataset.quizId);
</script>
<script>
(function () {
    const STORAGE_KEY = `quizapp_attempt_${quizId}`;
    let quiz = null;
    let questions = [];
    let currentIndex = 0;
    let answers = {};      // questionId -> "A"|"B"|"C"|"D"
    let startTime = null;  // epoch ms, persisted so a refresh can't reset the clock
    let submitted = false;
    let tickHandle = null;

    function loadAttemptState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const parsed = JSON.parse(raw);
                startTime = parsed.startTime;
                answers = parsed.answers || {};
                return;
            } catch (e) { /* fall through to fresh attempt */ }
        }
        startTime = Date.now();
        answers = {};
        persist();
    }

    function persist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ startTime, answers }));
    }

    function clearAttempt() {
        localStorage.removeItem(STORAGE_KEY);
    }

    async function init() {
        try {
            quiz = await Api.get(`/api/quizzes/${quizId}`);
            questions = await Api.get(`/api/quizzes/${quizId}/questions`);
        } catch (err) {
            showAlert('alertBox', err.message || 'Could not load this quiz');
            document.getElementById('loadingState').classList.add('d-none');
            return;
        }
        if (!questions.length) {
            showAlert('alertBox', 'This quiz has no questions yet.');
            document.getElementById('loadingState').classList.add('d-none');
            return;
        }

        loadAttemptState();

        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        if (elapsed >= quiz.durationInSeconds) {
            // Time already expired (e.g. tab was closed and reopened later) -- submit immediately.
            await submitQuiz(true);
            return;
        }

        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('quizArea').classList.remove('d-none');
        document.getElementById('quizTitle').textContent = quiz.title;

        renderQuestion();
        startTimer();

        document.getElementById('prevBtn').addEventListener('click', () => { currentIndex--; renderQuestion(); });
        document.getElementById('nextBtn').addEventListener('click', () => { currentIndex++; renderQuestion(); });
        document.getElementById('submitBtn').addEventListener('click', () => confirmSubmit());
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        document.getElementById('progressBadge').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
        document.getElementById('progressBar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
        document.getElementById('questionText').textContent = q.questionText;

        const opts = [['A', q.optionA], ['B', q.optionB], ['C', q.optionC], ['D', q.optionD]];
        document.getElementById('optionsArea').innerHTML = opts.map(([key, text]) => `
            <label class="option-row ${answers[q.id] === key ? 'selected' : ''}" data-key="${key}">
                <input type="radio" name="opt" value="${key}" ${answers[q.id] === key ? 'checked' : ''}>
                <strong>${key}.</strong> ${escapeHtml(text)}
            </label>
        `).join('');

        document.querySelectorAll('#optionsArea .option-row').forEach(row => {
            row.addEventListener('click', () => {
                answers[q.id] = row.dataset.key;
                persist();
                renderQuestion();
            });
        });

        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').classList.toggle('d-none', currentIndex === questions.length - 1);
        document.getElementById('submitBtn').classList.toggle('d-none', currentIndex !== questions.length - 1);
    }

    function startTimer() {
        const tick = () => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const remaining = quiz.durationInSeconds - elapsed;
            if (remaining <= 0) {
                document.getElementById('timerDisplay').textContent = '00:00';
                clearInterval(tickHandle);
                submitQuiz(true);
                return;
            }
            document.getElementById('timerDisplay').textContent = formatSeconds(remaining);
            document.getElementById('stopwatch').classList.toggle('critical', remaining <= 30);
        };
        tick();
        tickHandle = setInterval(tick, 1000);
    }

    function confirmSubmit() {
        const unanswered = questions.length - Object.keys(answers).length;
        const msg = unanswered > 0
            ? `You have ${unanswered} unanswered question${unanswered === 1 ? '' : 's'}. Submit anyway?`
            : 'Submit your quiz now? This cannot be undone.';
        if (confirm(msg)) submitQuiz(false);
    }

    async function submitQuiz(auto) {
        if (submitted) return;
        submitted = true;
        if (tickHandle) clearInterval(tickHandle);

        const timeTakenInSeconds = Math.min(quiz.durationInSeconds, Math.floor((Date.now() - startTime) / 1000));
        const payload = {
            quizId: quiz.id,
            timeTakenInSeconds,
            answers: Object.entries(answers).map(([questionId, selectedOption]) => ({
                questionId: Number(questionId), selectedOption,
            })),
        };

        try {
            const result = await Api.post('/api/results/submit', payload);
            clearAttempt();
            location.href = `/result/${result.resultId}`;
        } catch (err) {
            showAlert('alertBox', err.message || 'Could not submit your quiz. Please try again.');
            submitted = false;
            if (!auto) startTimer();
        }
    }

    init();
})();
</script>
</body>
</html>
