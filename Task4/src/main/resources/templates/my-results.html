<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('My Results')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <p class="section-eyebrow mb-1">Your history</p>
    <h1 class="mb-4">Previous attempts</h1>
    <div id="alertBox"></div>

    <div class="card-paper p-0 d-none" id="tableCard">
        <table class="table mb-0 align-middle">
            <thead>
                <tr class="text-secondary small text-uppercase">
                    <th class="ps-4">Quiz</th>
                    <th>Score</th>
                    <th>Percentage</th>
                    <th>Status</th>
                    <th>Time taken</th>
                    <th>Submitted</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

    <div id="emptyState" class="empty-state d-none">
        <h5>You haven't taken any quizzes yet</h5>
        <p class="mb-3">Once you complete a quiz, your results will show up here.</p>
        <a href="/dashboard" class="btn btn-amber">Browse quizzes</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
(async function () {
    try {
        const results = await Api.get('/api/results/me');
        if (!results.length) {
            document.getElementById('emptyState').classList.remove('d-none');
            return;
        }
        document.getElementById('tableCard').classList.remove('d-none');
        document.getElementById('resultsBody').innerHTML = results.map(r => `
            <tr style="cursor:pointer" onclick="location.href='/result/${r.resultId}'">
                <td class="ps-4 fw-semibold">${escapeHtml(r.quizTitle)}</td>
                <td class="text-mono">${r.score}/${r.totalMarks}</td>
                <td class="text-mono">${r.percentage}%</td>
                <td><span class="badge ${r.passed ? 'text-bg-success' : 'text-bg-danger'}">${r.passed ? 'Passed' : 'Failed'}</span></td>
                <td class="text-mono">${formatSeconds(r.timeTakenInSeconds)}</td>
                <td class="text-secondary small">${formatDate(r.submittedAt)}</td>
            </tr>
        `).join('');
    } catch (err) {
        showAlert('alertBox', err.message || 'Could not load your results');
    }
})();
</script>
</body>
</html>
