<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Results')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <p class="section-eyebrow mb-1">Admin</p>
    <h1 class="mb-4">All quiz results</h1>
    <div id="alertBox"></div>

    <div class="card-paper p-0 d-none" id="tableCard">
        <table class="table mb-0 align-middle">
            <thead>
                <tr class="text-secondary small text-uppercase">
                    <th class="ps-4">Student</th>
                    <th>Quiz</th>
                    <th>Score</th>
                    <th>Percentage</th>
                    <th>Status</th>
                    <th>Time taken</th>
                    <th class="pe-4">Submitted</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>
    <div id="emptyState" class="empty-state d-none">
        <h5>No attempts submitted yet</h5>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
(async function () {
    try {
        const results = await Api.get('/api/admin/results');
        if (!results.length) {
            document.getElementById('emptyState').classList.remove('d-none');
            return;
        }
        document.getElementById('tableCard').classList.remove('d-none');
        document.getElementById('resultsBody').innerHTML = results.map(r => `
            <tr>
                <td class="ps-4 fw-semibold">${escapeHtml(r.user.fullName)}</td>
                <td>${escapeHtml(r.quiz.title)}</td>
                <td class="text-mono">${r.score}/${r.totalMarks}</td>
                <td class="text-mono">${r.percentage}%</td>
                <td><span class="badge ${r.passed ? 'text-bg-success' : 'text-bg-danger'}">${r.passed ? 'Passed' : 'Failed'}</span></td>
                <td class="text-mono">${formatSeconds(r.timeTakenInSeconds)}</td>
                <td class="text-secondary small pe-4">${formatDate(r.submittedAt)}</td>
            </tr>
        `).join('');
    } catch (err) {
        showAlert('alertBox', err.message || 'Could not load results');
    }
})();
</script>
</body>
</html>
