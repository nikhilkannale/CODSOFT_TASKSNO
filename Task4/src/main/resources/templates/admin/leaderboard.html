<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Leaderboard')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container" style="max-width: 780px;">
    <p class="section-eyebrow mb-1">Admin</p>
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="mb-0">Leaderboard</h1>
        <select class="form-select w-auto" id="quizFilter">
            <option value="">Global (best attempt per student)</option>
        </select>
    </div>
    <div id="alertBox"></div>

    <div class="card-paper p-0 d-none" id="tableCard">
        <table class="table mb-0 align-middle">
            <thead>
                <tr class="text-secondary small text-uppercase">
                    <th class="ps-4">Rank</th>
                    <th>Student</th>
                    <th>Score</th>
                    <th>Percentage</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="board"></tbody>
        </table>
    </div>
    <div id="emptyState" class="empty-state d-none">
        <h5>No results yet</h5>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
async function loadBoard(quizId) {
    document.getElementById('alertBox').innerHTML = '';
    try {
        const board = quizId
            ? await Api.get(`/api/leaderboard/quiz/${quizId}`)
            : await Api.get('/api/leaderboard');
        if (!board.length) {
            document.getElementById('tableCard').classList.add('d-none');
            document.getElementById('emptyState').classList.remove('d-none');
            return;
        }
        document.getElementById('emptyState').classList.add('d-none');
        document.getElementById('tableCard').classList.remove('d-none');
        document.getElementById('board').innerHTML = board.map(e => `
            <tr>
                <td class="ps-4"><span class="rank-badge ${e.rank === 1 ? 'top1' : e.rank === 2 ? 'top2' : e.rank === 3 ? 'top3' : ''}">${e.rank}</span></td>
                <td class="fw-semibold">${escapeHtml(e.studentName)}</td>
                <td class="text-mono">${e.score}/${e.totalMarks}</td>
                <td class="text-mono">${e.percentage}%</td>
                <td class="text-mono">${formatSeconds(e.timeTakenInSeconds)}</td>
            </tr>
        `).join('');
    } catch (err) {
        showAlert('alertBox', err.message || 'Could not load the leaderboard');
    }
}

(async function () {
    try {
        const quizzes = await Api.get('/api/admin/quizzes');
        const select = document.getElementById('quizFilter');
        quizzes.forEach(q => {
            const opt = document.createElement('option');
            opt.value = q.id;
            opt.textContent = q.title;
            select.appendChild(opt);
        });
        select.addEventListener('change', () => loadBoard(select.value));
    } catch (e) { /* quiz list is a nice-to-have filter; ignore failures */ }
    loadBoard('');
})();
</script>
</body>
</html>
