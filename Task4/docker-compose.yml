version: "3.9"

# Spins up the Quiz Application together with a local PostgreSQL database.
# Usage:
#   docker compose up --build
# Then open http://localhost:8080
#
# Default admin login (change ADMIN_PASSWORD below for anything beyond local dev):
#   email:    admin@quizapp.com
#   password: Admin@123

services:
  db:
    image: postgres:16-alpine
    container_name: quizapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quizapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - quizapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: quizapp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/quizapp
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Generate a real random 32+ byte secret for anything beyond local dev, e.g.:
      #   openssl rand -base64 48
      JWT_SECRET: change-this-to-a-long-random-secret-before-any-real-deployment
      SEED_DATA: "true"
      ADMIN_EMAIL: admin@quizapp.com
      ADMIN_PASSWORD: Admin@123

volumes:
  quizapp_pgdata:
