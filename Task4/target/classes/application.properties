# ===============================
# Application
# ===============================
spring.application.name=quizapp
server.port=${PORT:8080}

# Defaults to the H2 in-memory "dev" profile so the app runs immediately with
# zero setup. Override with an environment variable (SPRING_PROFILES_ACTIVE=prod)
# once you're ready to point it at a real PostgreSQL database -- see
# application-prod.properties and docs/DEPLOYMENT.md.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# Datasource
# Defaults to local PostgreSQL. Override via environment variables in
# application-prod.properties / your deployment platform (Render, Docker, etc).
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quizapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false

# ===============================
# JWT
# IMPORTANT: override app.jwt.secret with a long random value via environment
# variable JWT_SECRET in any real deployment. Never commit real secrets.
# ===============================
# noinspection SpringBootApplicationProperties
app.jwt.secret=${JWT_SECRET:this-is-a-default-dev-secret-key-change-me-in-production-min-32-bytes}
# noinspection SpringBootApplicationProperties
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# Seed data (default admin + sample quiz on first boot)
# ===============================
# noinspection SpringBootApplicationProperties
app.seed-data=${SEED_DATA:true}
# noinspection SpringBootApplicationProperties
app.admin.email=${ADMIN_EMAIL:nikhilkannale7@gmail.com}
# noinspection SpringBootApplicationProperties
app.admin.password=${ADMIN_PASSWORD:Nikhil@1578}

# ===============================
# Misc
# ===============================
spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# data.sql is kept purely as reference/documentation -- real seeding happens in
# DataInitializer.java (needed anyway to BCrypt-hash the admin password).
spring.sql.init.mode=never