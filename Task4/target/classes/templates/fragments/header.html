<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · Quiz Application'">Quiz Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body th:fragment="navbar">
<nav class="navbar navbar-expand-md navbar-quiz navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">📘 QuizApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto" id="studentNavLinks">
                <li class="nav-item"><a class="nav-link" href="/dashboard">Quizzes</a></li>
                <li class="nav-item"><a class="nav-link" href="/my-results">My Results</a></li>
                <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
            </ul>
            <ul class="navbar-nav me-auto d-none" id="adminNavLinks">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/quizzes">Manage Quizzes</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/users">Users</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/results">Results</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/leaderboard">Leaderboard</a></li>
            </ul>
            <div class="d-flex align-items-center" id="navAuthArea">
                <!-- populated by js/api.js hydrateNav() -->
            </div>
        </div>
    </div>
</nav>
</body>
</html>
