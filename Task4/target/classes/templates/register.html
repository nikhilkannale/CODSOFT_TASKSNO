<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sign up')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-paper p-4 p-md-5">
                <p class="section-eyebrow mb-1">New here?</p>
                <h2 class="mb-4">Create your account</h2>
                <div id="alertBox"></div>
                <form id="registerForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="fullName">Full name</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" id="password" minlength="6" required>
                        <div class="form-text">At least 6 characters.</div>
                    </div>
                    <button type="submit" class="btn btn-amber w-100 py-2" id="submitBtn">Create account</button>
                </form>
                <p class="text-center text-secondary mt-4 mb-0">
                    Already have an account? <a href="/login">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account…';
    try {
        await Api.post('/api/auth/register', {
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
        });
        location.href = '/dashboard';
    } catch (err) {
        const details = err.details && err.details.length ? ': ' + err.details.join(', ') : '';
        showAlert('alertBox', (err.message || 'Registration failed') + details);
        btn.disabled = false;
        btn.textContent = 'Create account';
    }
});
</script>
</body>
</html>
