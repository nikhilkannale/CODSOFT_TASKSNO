# ===============================
# Application
# ===============================
spring.application.name=student-course-registration-system
server.port=${PORT:8080}
server.error.include-message=always

# ===============================
# Datasource (defaults to local Postgres; override via env vars in production)
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/scrs_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Nikhil@1578}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyInProductionEnvironmentVariableAtLeast256BitsLong123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# Multipart (profile picture upload)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/profile-pictures}

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# Logging
# ===============================
logging.level.com.codsoft.scrs=INFO
