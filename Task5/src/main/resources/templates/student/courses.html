<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Browse Courses')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container my-5">
    <h2 class="fw-bold mb-4">Available Courses</h2>

    <form th:action="@{/student/courses}" method="get" class="row g-2 mb-4">
        <div class="col-md-5">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by title, code, or instructor...">
        </div>
        <div class="col-md-3">
            <input type="text" name="department" th:value="${department}" class="form-control" placeholder="Department">
        </div>
        <div class="col-md-2">
            <input type="number" name="semester" th:value="${semester}" class="form-control" placeholder="Semester">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-filter me-1"></i>Filter</button>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="course : ${courses}">
            <div class="card course-card h-100 p-3">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="badge bg-secondary" th:text="${course.courseCode}"></span>
                    <span class="badge" th:classappend="${course.availableSeats > 0} ? 'badge-seats-open' : 'badge-seats-full'"
                          th:text="${course.availableSeats > 0} ? (${course.availableSeats} + ' seats left') : 'Full'"></span>
                </div>
                <h5 class="fw-bold" th:text="${course.title}"></h5>
                <p class="text-muted small mb-1"><i class="fa-solid fa-chalkboard-user me-1"></i><span th:text="${course.instructor} ?: 'TBA'"></span></p>
                <p class="text-muted small mb-1"><i class="fa-solid fa-building me-1"></i><span th:text="${course.department} ?: 'General'"></span> &middot; Sem <span th:text="${course.semester} ?: '-'"></span></p>
                <p class="text-muted small mb-3"><i class="fa-solid fa-clock me-1"></i><span th:text="${course.schedule} ?: 'Schedule TBA'"></span></p>
                <a th:href="@{'/student/courses/' + ${course.id}}" class="btn btn-outline-primary mt-auto">View Details</a>
            </div>
        </div>
    </div>

    <p class="text-muted mt-4" th:if="${#lists.isEmpty(courses)}">No courses matched your search.</p>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
