<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <div class="card auth-card">
        <div class="card-body p-5">
            <h3 class="fw-bold text-center mb-1"><i class="fa-solid fa-right-to-bracket text-primary me-2"></i>Login</h3>
            <p class="text-center text-muted mb-4">Sign in to your SCRS account</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${param.error}" class="alert alert-danger">Invalid email or password. Please try again.</div>
            <div th:if="${param.logout}" class="alert alert-info">You have been logged out successfully.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Don't have an account? <a th:href="@{/register}">Sign up here</a>
            </p>
            <p class="text-center small text-muted mt-2">Demo admin: admin&#64;scrs.com / Admin&#64;123</p>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
