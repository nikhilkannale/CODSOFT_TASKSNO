<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Manage Students')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container my-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <h2 class="fw-bold mb-4">Manage Students</h2>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white">
            <thead><tr><th>Student ID</th><th>Name</th><th>Email</th><th>Department</th><th>Semester</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.studentId}"></td>
                <td th:text="${s.fullName}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.department} ?: '-'"></td>
                <td th:text="${s.semester} ?: '-'"></td>
                <td>
                    <form th:action="@{'/admin/students/' + ${s.id} + '/delete'}" method="post" data-confirm="Remove this student permanently? All their enrollments will also be removed.">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash me-1"></i>Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(students)}">No students registered yet.</p>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
