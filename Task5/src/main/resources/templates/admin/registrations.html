<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Manage Registrations')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container my-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <h2 class="fw-bold mb-4">All Registrations</h2>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white">
            <thead><tr><th>Student</th><th>Course</th><th>Enrolled On</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="e : ${enrollments}">
                <td th:text="${e.student.fullName}"></td>
                <td th:text="${e.course.courseCode} + ' - ' + ${e.course.title}"></td>
                <td th:text="${#temporals.format(e.enrollmentDate, 'dd MMM yyyy')}"></td>
                <td><span class="badge" th:classappend="${e.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'" th:text="${e.status}"></span></td>
                <td>
                    <form th:if="${e.status.name() == 'ACTIVE'}" th:action="@{'/admin/registrations/' + ${e.id} + '/drop'}" method="post"
                          data-confirm="Drop this student's registration and release the seat?">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-xmark me-1"></i>Drop</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(enrollments)}">No registrations yet.</p>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
