<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <div class="card auth-card">
        <div class="card-body p-5">
            <h3 class="fw-bold text-center mb-1"><i class="fa-solid fa-user-plus text-primary me-2"></i>Create Account</h3>
            <p class="text-center text-muted mb-4">Register as a student to start enrolling in courses</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="Jane Doe">
                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="you@example.com">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters">
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="row">
                    <div class="col-md-7 mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" th:field="*{department}" class="form-control" placeholder="Computer Science">
                    </div>
                    <div class="col-md-5 mb-3">
                        <label class="form-label">Semester</label>
                        <input type="number" th:field="*{semester}" min="1" max="12" class="form-control" placeholder="1">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Already have an account? <a th:href="@{/login}">Login here</a>
            </p>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
